<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .loading { background-color: #fff3cd; border-color: #ffeaa7; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        select { padding: 8px; margin: 5px; min-width: 200px; }
    </style>
</head>
<body>
    <h1>State & City API Test</h1>
    
    <div>
        <button onclick="testStatesAPI()">Test States API</button>
        <button onclick="testCitiesAPI()">Test Cities API (Select State First)</button>
    </div>
    
    <div>
        <label>Select State:</label>
        <select id="stateSelect" onchange="loadCities()">
            <option value="">Select State</option>
        </select>
    </div>
    
    <div>
        <label>Select City:</label>
        <select id="citySelect">
            <option value="">Select City</option>
        </select>
    </div>
    
    <div id="results"></div>

    <script>
        const API_KEY = 'N3hJNDk4TEl0bTAzSnE2RVdhZzdaQXN3OElvTzRnRnlaY3VYdVhVSg==';
        const BASE_URL = 'https://api.countrystatecity.in/v1';
        
        function addResult(message, type = 'result') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            document.getElementById('results').appendChild(div);
            console.log(message);
        }
        
        function testStatesAPI() {
            addResult('Testing States API...', 'loading');
            
            fetch(`${BASE_URL}/countries/IN/states`, {
                method: 'GET',
                headers: {
                    'X-CSCAPI-KEY': API_KEY,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                addResult(`States API Response Status: ${response.status}`, response.ok ? 'success' : 'error');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                return response.json();
            })
            .then(states => {
                addResult(`✅ States loaded successfully: ${states.length} states`, 'success');
                
                // Populate state dropdown
                const stateSelect = document.getElementById('stateSelect');
                stateSelect.innerHTML = '<option value="">Select State</option>';
                
                states.forEach(state => {
                    const option = document.createElement('option');
                    option.value = state.iso2;
                    option.textContent = state.name;
                    option.setAttribute('data-name', state.name);
                    stateSelect.appendChild(option);
                });
                
                addResult(`States dropdown populated with ${states.length} options`, 'success');
            })
            .catch(error => {
                addResult(`❌ Error loading states: ${error.message}`, 'error');
            });
        }
        
        function loadCities() {
            const stateSelect = document.getElementById('stateSelect');
            const citySelect = document.getElementById('citySelect');
            const stateCode = stateSelect.value;
            const stateName = stateSelect.options[stateSelect.selectedIndex]?.getAttribute('data-name') || 'Unknown';
            
            citySelect.innerHTML = '<option value="">Select City</option>';
            
            if (stateCode) {
                addResult(`Loading cities for ${stateName} (${stateCode})...`, 'loading');
                
                fetch(`${BASE_URL}/countries/IN/states/${stateCode}/cities`, {
                    method: 'GET',
                    headers: {
                        'X-CSCAPI-KEY': API_KEY,
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => {
                    addResult(`Cities API Response Status: ${response.status}`, response.ok ? 'success' : 'error');
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    return response.json();
                })
                .then(cities => {
                    addResult(`✅ Cities loaded successfully: ${cities.length} cities for ${stateName}`, 'success');
                    
                    cities.forEach(city => {
                        const option = document.createElement('option');
                        option.value = city.name;
                        option.textContent = city.name;
                        citySelect.appendChild(option);
                    });
                    
                    addResult(`Cities dropdown populated with ${cities.length} options`, 'success');
                })
                .catch(error => {
                    addResult(`❌ Error loading cities: ${error.message}`, 'error');
                });
            }
        }
        
        function testCitiesAPI() {
            const stateSelect = document.getElementById('stateSelect');
            if (!stateSelect.value) {
                addResult('❌ Please select a state first to test cities API', 'error');
                return;
            }
            loadCities();
        }
        
        // Auto-load states on page load
        window.addEventListener('load', function() {
            addResult('Page loaded - Auto-testing States API...', 'loading');
            testStatesAPI();
        });
    </script>
</body>
</html>
